version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
      - echo "Downloading env from S3"
      - aws s3 cp "$S3_ENV_FILE_URI" /tmp/app.env
      - test -f /tmp/app.env
      - sed -i 's/\r$//' /tmp/app.env

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building Docker image for $SERVICE_NAME"
      - docker build -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" -f "$DOCKERFILE_PATH" .

  post_build:
    commands:
      - echo "Pushing image to ECR"
      - docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
      - |
          python3 - <<'PY'
          import os
          import textwrap

          app_name = os.environ["APP_NAME"]
          namespace = os.environ["NAMESPACE"]
          service_account_name = os.environ["SERVICE_ACCOUNT_NAME"]
          s3_env_file_uri = os.environ["S3_ENV_FILE_URI"]
          target_group_arn = os.environ["TARGET_GROUP_ARN"]
          port_name = os.environ["PORT_NAME"]
          container_port = os.environ["CONTAINER_PORT"]
          service_port = os.environ["SERVICE_PORT"]
          health_path = os.environ["HEALTH_PATH"]
          runtime_command = os.environ["RUNTIME_COMMAND"]
          image = f"{os.environ['ECR_REPOSITORY_URI']}:{os.environ['IMAGE_TAG']}"

          manifest = textwrap.dedent(f"""\
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {app_name}
            namespace: {namespace}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {app_name}
            template:
              metadata:
                labels:
                  app: {app_name}
              spec:
                serviceAccountName: {service_account_name}
                volumes:
                  - name: runtime-env
                    emptyDir:
                      medium: Memory
                initContainers:
                  - name: load-env-from-s3
                    image: public.ecr.aws/aws-cli/aws-cli:2.15.57
                    command: ["/bin/sh", "-c"]
                    args:
                      - aws s3 cp "{s3_env_file_uri}" /work/app.env && test -f /work/app.env
                    volumeMounts:
                      - name: runtime-env
                        mountPath: /work
                containers:
                  - name: {app_name}
                    image: {image}
                    imagePullPolicy: Always
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -a
                        . /runtime/app.env
                        set +a
                        {runtime_command}
                    volumeMounts:
                      - name: runtime-env
                        mountPath: /runtime
                    ports:
                      - name: {port_name}
                        containerPort: {container_port}
                        protocol: TCP
                    resources:
                      requests:
                        cpu: "250m"
                        memory: "512Mi"
                      limits:
                        cpu: "500m"
                        memory: "1Gi"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: {app_name}
            namespace: {namespace}
          spec:
            type: NodePort
            selector:
              app: {app_name}
            ports:
              - name: {port_name}
                port: {service_port}
                targetPort: {container_port}
                protocol: TCP
          ---
          apiVersion: elbv2.k8s.aws/v1beta1
          kind: TargetGroupBinding
          metadata:
            name: {app_name}
            namespace: {namespace}
          spec:
            serviceRef:
              name: {app_name}
              port: {service_port}
            targetGroupARN: {target_group_arn}
            targetType: instance
          """)

          with open("manifest.yaml", "w", encoding="utf-8") as f:
              f.write(manifest)
          PY
      - test -f manifest.yaml
      - echo "manifest.yaml generated"

artifacts:
  files:
    - manifest.yaml